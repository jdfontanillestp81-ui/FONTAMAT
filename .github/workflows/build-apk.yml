name: CI Build Android APK
- name: 🛠️ Fixer les versions d'autoconf et libtool
  run: |
    sudo apt-get remove -y autoconf automake libtool
    sudo apt-get install -y autoconf automake libtool
on:
  push:
    branches: [ principal, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 🛠️ Installer les dépendances système
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld

    - name: 📦 Installer Buildozer et Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython

    - name: ⚙️ Compiler l'APK avec Buildozer
      run: |
        buildozer -v android debug

    - name: 🚀 Sauvegarder l'APK généré
      uses: actions/upload-artifact@v4
      with:
        name: fontamat-apk
        path: bin/*.apk
